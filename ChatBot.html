<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Career Mentor</title>
    <link rel="stylesheet" href="ChatBot.css" />
  </head>
  <body>
    <div id="container">
      <div id="title_box">
        <h1>AI CAREER MENTOR</h1>
      </div>
    </div>

    <div id="chatbox">
      <h2>🎓 Ask Your Career Mentor</h2>
      <div id="response"></div>
      <textarea
        id="userInput"
        placeholder="Ask your career-related question..."
      ></textarea>
      <button id="askButton">Ask Mentor</button>
    </div>
    <script src="ChatBot.js"></script>
  </body>
</html>
